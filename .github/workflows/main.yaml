name: Deploy Vue

on:
    push:
        branches: ["cicd"]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install & Build
              run: |
                  npm ci
                  npm run build

            - name: Deploy to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /var/www/ambrosia-frontend
                      git checkout cicd
                      git pull origin cicd
                      npm install          
                      npm run build
